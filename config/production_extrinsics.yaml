# scanarMini Production Extrinsics Configuration File
# This file is loaded by the scanner runtime at startup.
# It defines the active transformation matrices between all sensors.

metadata:
  active_profile: "scanarV4_45deg"  # Choices: [scanarV4_45deg, bag_d, cad_factory]
  airy_serial: "030000003009"
  gemini_serial: "CPC6463000XW"
  updated_timestamp: "2026-09-02T17:55:00"
  mounting_angle_deg: 45.0

# Active transforms based on Device 2 (scanarV4) 45-degree experimental results
active_transforms:
  # Left IR Cam0 Optical Frame <- RoboSense Airy Native IMU (FAST-LIVO2 body frame)
  # p_cam0 = T_cam0_airy_imu * p_imu
  T_cam0_airy_imu:
    matrix:
      - [ 0.999944, -0.003490, -0.010008,  0.039251]
      - [ 0.004480, -0.716562,  0.697509, -0.056910]
      - [-0.009605, -0.697515, -0.716506, -0.030089]
      - [ 0.000000,  0.000000,  0.000000,  1.000000]
    translation_m: [0.039251, -0.056910, -0.030089]
    translation_status: "experimentally_validated_scanarV4"

  # Right IR Cam1 Optical Frame <- RoboSense Airy Native IMU
  # p_cam1 = T_cam1_airy_imu * p_imu
  # Computed using stereo baseline: T_cam1_airy_imu = T_cam1_cam0 * T_cam0_airy_imu
  T_cam1_airy_imu:
    matrix:
      - [ 0.999944, -0.003490, -0.010008, -0.056028]
      - [ 0.004480, -0.716562,  0.697509, -0.056910]
      - [-0.009605, -0.697515, -0.716506, -0.030089]
      - [ 0.000000,  0.000000,  0.000000,  1.000000]
    translation_m: [-0.056028, -0.056910, -0.030089]

  # Left IR Camera -> Right IR Camera (T_cam1_cam0)
  # p_cam1 = T_cam1_cam0 * p_cam0
  T_cam1_cam0:
    matrix:
      - [ 1.000000,  0.000000,  0.000000, -0.095279]
      - [ 0.000000,  1.000000,  0.000000,  0.000000]
      - [ 0.000000,  0.000000,  1.000000,  0.000000]
      - [ 0.000000,  0.000000,  0.000000,  1.000000]
    translation_m: [-0.095279, 0.0, 0.0]

  # Cam0 Left IR Frame <- RoboSense Airy LiDAR Base Center
  # p_cam0 = T_cam0_airy_lidar * p_lidar
  # Composed from T_cam0_airy_imu @ T_airy_imu_airy_lidar (matching FAST-LIVO2 extrinsic_R)
  T_cam0_airy_lidar:
    matrix:
      - [ 0.015886, -0.999704,  0.018422,  0.043444]
      - [ 0.714412, -0.001542, -0.699724, -0.063060]
      - [ 0.699546,  0.024276,  0.714175, -0.029978]
      - [ 0.000000,  0.000000,  0.000000,  1.000000]
    translation_m: [0.043444, -0.063060, -0.029978]

  # RGB Color Optical Frame <- RoboSense Airy LiDAR Base Center
  # p_rgb = T_rgb_airy_lidar * p_lidar
  T_rgb_airy_lidar:
    matrix:
      - [ 0.015158, -0.999697,  0.019378,  0.067244]
      - [ 0.713970, -0.002746, -0.700172, -0.063082]
      - [ 0.700012,  0.024449,  0.713710, -0.030452]
      - [ 0.000000,  0.000000,  0.000000,  1.000000]
    translation_m: [0.067244, -0.063082, -0.030452]

  # RGB Color Optical Frame <- RoboSense Airy IMU Frame (FAST-LIVO2 body frame)
  # p_rgb = T_rgb_airy_imu * p_imu
  # Derived from T_rgb_depth @ T_cam0_airy_imu
  T_rgb_airy_imu:
    matrix:
      - [ 0.999936, -0.002759, -0.010962,  0.063044]
      - [ 0.005675, -0.716106,  0.697968, -0.056937]
      - [-0.009776, -0.697985, -0.716045, -0.030558]
      - [ 0.000000,  0.000000,  0.000000,  1.000000]
    translation_m: [0.063044, -0.056937, -0.030558]

# Reconstructed CAD Extrinsic References
cad_references:
  T_cam0_airy_lidar_cad:
    matrix:
      - [ 0.000000, -1.000000,  0.000000,  0.043444]
      - [ 0.707107,  0.000000, -0.707107, -0.063060]
      - [ 0.707107,  0.000000,  0.707107, -0.029978]
