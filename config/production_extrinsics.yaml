  # Authoritative RoboSense Airy LiDAR <- IMU Transform (T_airy_lidar_airy_imu, inverse of FAST-LIVO2 extrinsic_R/T)
  # p_lidar = T_airy_lidar_airy_imu * p_imu
  T_airy_lidar_airy_imu:
    matrix:
      - [ 0.012366, -0.999919, -0.003080,  0.004250]
      - [-0.999888, -0.012340, -0.008465,  0.004179]
      - [ 0.008426,  0.003183, -0.999960, -0.004460]
      - [ 0.000000,  0.000000,  0.000000,  1.000000]
    translation_m: [0.004250, 0.004179, -0.004460]

  # Authoritative RoboSense Airy IMU <- LiDAR Transform (T_airy_imu_airy_lidar, matching FAST-LIVO2 extrinsic_R/T)
  # p_imu = T_airy_imu_airy_lidar * p_lidar
  T_airy_imu_airy_lidar:
    matrix:
      - [ 0.012366, -0.999888,  0.008426,  0.004164]
      - [-0.999919, -0.012340,  0.003184,  0.004315]
      - [-0.003079, -0.008465, -0.999959, -0.004411]
      - [ 0.000000,  0.000000,  0.000000,  1.000000]
    translation_m: [0.004164, 0.004315, -0.004411]

  # Orbbec Gemini 336L Archived Factory EEPROM Depth -> RGB Optical Transform (T_rgb_depth)
  # p_rgb = T_rgb_depth * p_depth
  T_rgb_depth:
    matrix:
      - [ 0.999999, -0.001189,  0.000174,  0.0237306]
      - [ 0.001189,  0.999999, -0.000658, -0.0000932]
      - [-0.000174,  0.000658,  0.999999, -0.0004246]
      - [ 0.000000,  0.000000,  0.000000,  1.0000000]
    translation_m: [0.0237306, -0.0000932, -0.0004246]
